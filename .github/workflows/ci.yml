name: CI Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  verify:
    name: Architecture & Engine Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Ruby
        uses: actions/setup-ruby@v1
        with:
          ruby-version: '2.7'

      - name: Syntax Check Ruby Models & Services
        run: |
          ruby -c app/models/order.rb
          ruby -c app/models/user.rb
          ruby -c app/models/client.rb
          ruby -c app/controllers/orders_controller.rb
          ruby -c app/services/remittance_calculator_service.rb
          ruby -c app/services/venezuelan_bank_directory_service.rb
          ruby -c app/services/compliance_audit_service.rb

      - name: Run Architecture Verification Suite
        run: |
          python3 scripts/verify_remittance_engine.py

      - name: Validate Docker Compose Configuration
        run: |
          docker compose config --quiet
